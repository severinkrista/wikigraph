name: Android APK
on:
  push:
    branches: [main, android-prototype]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Name APK with app version
        id: apk
        shell: bash
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          APK="wikigraph-${VERSION}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/${APK}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "path=app/build/outputs/apk/debug/${APK}" >> "$GITHUB_OUTPUT"
      - name: Upload versioned APK
        uses: actions/upload-artifact@v4
        with:
          name: wikigraph-${{ steps.apk.outputs.version }}-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30
